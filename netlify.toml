# Netlify reads this before its dashboard settings.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Netlify doesn't know the .webmanifest extension and would serve it as a download.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
